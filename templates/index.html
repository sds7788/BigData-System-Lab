<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTC 智能校园搜索引擎 v3.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root { --ustc-blue: #004EA2; --bg-light: #f4f7f6; }
        body { background-color: var(--bg-light); font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        
        /* === 顶部 Hero 区域 === */
        .hero-section {
            background: linear-gradient(135deg, var(--ustc-blue) 0%, #00204a 100%);
            color: white; padding: 80px 0 120px; 
            margin-bottom: -80px; /* 让下方卡片上浮覆盖 */
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
            position: relative;
            overflow: hidden;
        }

        /* 品牌 Logo 区域样式 */
        .brand-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .brand-logo {
            width: 150px; /* 大气尺寸 */
            height: 150px;
            background-color: transparent; /* 透明背景 */
            margin-right: 15px;
            object-fit: cover;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); /* 柔和阴影 */
        }

        .brand-text { text-align: left; }

        .brand-title {
            font-size: 3.8rem; /* 大标题 */
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .brand-subtitle {
            font-size: 1.1rem;
            opacity: 0.85;
            font-weight: 300;
            margin: 0;
        }
        
        /* 搜索框优化 */
        .search-box { 
            height: 55px; border-radius: 30px; border: none; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-size: 1.1rem;
        }
        .search-btn { 
            position: absolute; right: 5px; top: 4px; height: 47px; width: 47px; 
            border-radius: 50%; background: var(--ustc-blue); color: white; border: none; 
            transition: transform 0.2s;
        }
        .search-btn:hover { transform: scale(1.05); }

        /* 数据卡片样式 */
        .stat-card {
            background: white; border-radius: 12px; border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        
        /* 悬浮 AI 按钮 */
        .fab-ai {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: linear-gradient(45deg, #004EA2, #00A0E9); color: white;
            border-radius: 50%; box-shadow: 0 4px 20px rgba(0, 78, 162, 0.4);
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            cursor: pointer; transition: transform 0.3s; z-index: 1000;
        }
        .fab-ai:hover { transform: scale(1.1) rotate(10deg); }

        /* AI 对话框样式 */
        .ai-modal-body { height: 400px; overflow-y: auto; background: #f8f9fa; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 12px 18px; border-radius: 15px; max-width: 85%; line-height: 1.6; }
        .msg-ai { background: white; border: 1px solid #eee; margin-right: auto; border-bottom-left-radius: 2px; }
        .msg-user { background: #e3f2fd; color: #004EA2; margin-left: auto; border-bottom-right-radius: 2px; }
        
        /* Markdown 渲染优化 */
        .msg-ai p { margin-bottom: 0.5rem; }
        .msg-ai ul, .msg-ai ol { padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .msg-ai code { background-color: #f1f3f5; color: #c7254e; padding: 2px 4px; border-radius: 4px; }
        .msg-ai pre { background-color: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="hero-section text-center">
        <div class="container">
            
            <div class="brand-wrapper">
                <img src="/static/logo.png" alt="Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/150?text=DS'">
                <div class="brand-text">
                    <h1 class="brand-title">USTC Data Insight</h1>
                    <p class="brand-subtitle">Hadoop & HBase 驱动的校园大数据检索引擎</p>
                </div>
            </div>
            
            <form action="/search" method="get" style="max-width: 620px; margin: 0 auto; position: relative;">
                <input type="text" name="q" class="form-control search-box" placeholder="试一试：'研究生毕业论文格式要求' 或 '校车时刻表'" required>
                <input type="hidden" name="mode" value="keyword"> 
                <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
            </form>
            
            <div class="mt-4 opacity-75">
                <span class="badge rounded-pill bg-white text-primary bg-opacity-10 border border-white border-opacity-25 me-2 px-3 py-2">
                    <i class="fas fa-database me-1"></i>HBase Storage
                </span>
                <span class="badge rounded-pill bg-white text-success bg-opacity-10 border border-white border-opacity-25 px-3 py-2">
                    <i class="fas fa-microchip me-1"></i>Vector RAG
                </span>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 40px;">
        <div class="row g-4">
            
            <div class="col-lg-4 col-md-12">
                <div class="stat-card h-100 d-flex flex-column">
                    <div class="card-body text-center d-flex flex-column justify-content-center py-5">
                        <div class="mb-3 text-muted text-uppercase fw-bold small ls-1">Indexed Documents</div>
                        <h1 class="display-3 fw-bold text-primary mb-2" id="total-data">...</h1>
                        <div class="text-muted mb-4">全量收录文档</div>
                        
                        <div class="row px-4">
                            <div class="col-6 border-end">
                                <div class="h4 mb-0 text-dark" id="file-count">0</div>
                                <small class="text-secondary"><i class="fas fa-file-pdf text-danger me-1"></i>附件</small>
                            </div>
                            <div class="col-6">
                                <div class="h4 mb-0 text-dark" id="page-count">0</div>
                                <small class="text-secondary"><i class="fas fa-globe text-info me-1"></i>网页</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 col-md-12">
                <div class="stat-card h-100">
                    <div class="card-body">
                        <div id="dept-chart" style="width: 100%; height: 350px;"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-12">
                <div class="stat-card">
                    <div class="card-body">
                        <div id="year-chart" style="width: 100%; height: 320px;"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="text-center py-5 text-muted small opacity-50">
        &copy; 2025 USTC Big Data System Experiment | Powered by Hadoop Ecosystem & DeepSeek AI
    </div>

    <div class="fab-ai" data-bs-toggle="modal" data-bs-target="#aiGlobalModal" title="唤醒 AI 助手">
        <i class="fas fa-robot"></i>
    </div>

    <div class="modal fade" id="aiGlobalModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-brain me-2"></i>全库智能问答助手</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="ai-modal-body" id="globalChatBox">
                        <div class="d-flex"><div class="msg msg-ai">
                            👋 你好！我是科大校园数据助手。<br>
                            我可以基于底层 HBase 存储的数千份文档，回答你的任何问题。
                        </div></div>
                    </div>
                    <div class="p-3 border-top bg-white">
                        <div class="input-group">
                            <input type="text" id="globalInput" class="form-control form-control-lg border-0 bg-light" placeholder="例如：'今年奖学金评定标准有什么变化？'...">
                            <button class="btn btn-primary px-4" onclick="sendGlobalMsg()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 初始化 ECharts
        const deptChart = echarts.init(document.getElementById('dept-chart'));
        const yearChart = echarts.init(document.getElementById('year-chart'));
        
        // 响应式调整
        window.addEventListener('resize', function() {
            deptChart.resize();
            yearChart.resize();
        });

        // 1. 加载后端统计数据
        fetch('/api/stats')
            .then(response => response.json())
            .then(data => {
                document.getElementById('total-data').innerText = data.total_data;
                document.getElementById('file-count').innerText = data.total_files;
                document.getElementById('page-count').innerText = data.total_pages;

                // 部门图表
                deptChart.setOption({
                    title: { text: '🏫 部门/来源分布 TOP 10', left: '20px', top: '15px', textStyle: { fontSize: 16 } },
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '3%', right: '5%', bottom: '3%', top: '60px', containLabel: true },
                    xAxis: { type: 'value', splitLine: { lineStyle: { type: 'dashed' } } },
                    yAxis: { type: 'category', data: Object.keys(data.dept_counts).reverse(), axisLine: { show: false }, axisTick: { show: false } },
                    series: [{
                        name: '文档量', type: 'bar', data: Object.values(data.dept_counts).reverse(), barWidth: '50%',
                        itemStyle: { color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [{ offset: 0, color: '#36D1DC' }, { offset: 1, color: '#5B86E5' }]), borderRadius: [0, 6, 6, 0] },
                        label: { show: true, position: 'right', fontWeight: 'bold' }
                    }]
                });

                // 年份图表
                const sortedYears = Object.keys(data.year_counts).sort();
                const sortedValues = sortedYears.map(y => data.year_counts[y]);
                yearChart.setOption({
                    title: { text: '📈 数据时间跨度分布趋势', left: '20px', top: '10px' },
                    tooltip: { trigger: 'axis' },
                    grid: { left: '3%', right: '3%', bottom: '10%', containLabel: true },
                    xAxis: { type: 'category', boundaryGap: false, data: sortedYears },
                    yAxis: { type: 'value' },
                    series: [{
                        name: '收录量', type: 'line', smooth: true, symbol: 'circle', symbolSize: 8, data: sortedValues,
                        itemStyle: { color: '#28a745' },
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(40, 167, 69, 0.5)' }, { offset: 1, color: 'rgba(40, 167, 69, 0.05)' }]) }
                    }]
                });
            })
            .catch(err => console.error("无法加载统计数据:", err));

        // 2. 全局 AI 聊天逻辑 (带 Markdown 解析)
        function sendGlobalMsg() {
            const input = document.getElementById('globalInput');
            const val = input.value.trim();
            if(!val) return;
            
            const box = document.getElementById('globalChatBox');
            box.innerHTML += `<div class="d-flex"><div class="msg msg-user">${val}</div></div>`;
            input.value = '';
            
            const loadId = 'loading-' + Date.now();
            box.innerHTML += `<div class="d-flex" id="${loadId}"><div class="msg msg-ai"><i class="fas fa-circle-notch fa-spin me-2"></i>正在检索 HBase 并生成回答...</div></div>`;
            box.scrollTop = box.scrollHeight;

            fetch('/api/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: val, scope: 'global' })
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById(loadId).remove();
                
                // ✅ 解析 Markdown
                const htmlAns = marked.parse(data.answer);
                
                box.innerHTML += `<div class="d-flex"><div class="msg msg-ai">${htmlAns}</div></div>`;
                box.scrollTop = box.scrollHeight;
            });
        }
        
        document.getElementById('globalInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendGlobalMsg();
        });
    </script>
</body>
</html>
